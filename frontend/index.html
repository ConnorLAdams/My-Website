<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("ca-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/Red_Panda_Tab.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#75834d" />
    <meta
      name="description"
      content="C. Adams — BI Manager & Mathematician. Personal portfolio: education, research, and projects."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>C. Adams — BI Manager & Mathematician</title>
  </head>

    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
