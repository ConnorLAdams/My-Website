<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="A cartoon rooster surfing a wave">
  <!-- splash -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M34 178c-12-6-16-18-8-28 0 12 8 18 18 18z"/>
    <path d="M206 182c12-4 18-16 12-28-2 12-12 16-22 14z"/>
  </g>
  <!-- surfboard -->
  <g transform="rotate(-10 120 174)">
    <ellipse cx="120" cy="174" rx="104" ry="17" fill="#e14b3b"/>
    <ellipse cx="120" cy="174" rx="104" ry="17" fill="none" stroke="#b7352a" stroke-width="2"/>
    <line x1="26" y1="174" x2="214" y2="174" stroke="#ffd9b0" stroke-width="2.5" opacity="0.7"/>
  </g>
  <!-- tail feathers -->
  <path d="M86 98C52 82 44 62 60 46c8 22 30 30 34 46z" fill="#2f9f74"/>
  <path d="M82 110C46 100 34 84 44 64c16 20 42 22 50 38z" fill="#3aa0d0"/>
  <path d="M82 124C46 124 30 116 34 96c20 16 46 8 58 22z" fill="#f0a83c"/>
  <!-- legs -->
  <path d="M110 156l-4 14" stroke="#f0851d" stroke-width="6" stroke-linecap="round"/>
  <path d="M128 156l4 14" stroke="#f0851d" stroke-width="6" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="118" cy="116" rx="41" ry="45" fill="#f4a63c"/>
  <ellipse cx="110" cy="128" rx="22" ry="26" fill="#f8c46e" opacity="0.85"/>
  <!-- wing -->
  <path d="M106 108c16 8 30 6 42-2-8 24-34 26-46 14-2-4-1-9 4-12z" fill="#e0872b"/>
  <!-- head -->
  <circle cx="150" cy="82" r="23" fill="#f4a63c"/>
  <!-- comb -->
  <path d="M138 66l7-15 7 15z" fill="#d63b2f"/>
  <path d="M149 66l7-17 8 17z" fill="#d63b2f"/>
  <path d="M160 66l6-13 7 13z" fill="#d63b2f"/>
  <!-- beak -->
  <path d="M171 84l22-4-20 14z" fill="#f0851d"/>
  <!-- wattle -->
  <path d="M168 92c6 14-1 21-3 22-6-5-6-16 3-22z" fill="#d63b2f"/>
  <!-- eye -->
  <circle cx="156" cy="80" r="3.8" fill="#241812"/>
  <circle cx="157.3" cy="78.7" r="1.2" fill="#ffffff"/>
</svg>
