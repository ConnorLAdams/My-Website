<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-label="A cartoon rooster surfing, four animation frames">
  <defs>
    <!-- Reusable rooster + board (no wing; wing is drawn per frame for the flap). -->
    <g id="chick">
      <!-- surfboard -->
      <ellipse cx="100" cy="150" rx="76" ry="12" fill="#e5533d"/>
      <ellipse cx="100" cy="150" rx="76" ry="12" fill="none" stroke="#c23f2e" stroke-width="2"/>
      <line x1="30" y1="150" x2="170" y2="150" stroke="#ffd9b0" stroke-width="2" opacity="0.7"/>
      <!-- legs -->
      <path d="M92 132 L88 146" stroke="#f0851d" stroke-width="6" stroke-linecap="round"/>
      <path d="M108 132 L112 146" stroke="#f0851d" stroke-width="6" stroke-linecap="round"/>
      <!-- tail feathers -->
      <path d="M74 92C40 78 34 58 50 44c10 22 32 26 38 44z" fill="#2f9f74"/>
      <path d="M72 104C36 96 26 80 36 60c18 20 42 20 52 38z" fill="#3aa0d0"/>
      <path d="M74 116C40 118 26 108 30 88c20 16 46 8 58 24z" fill="#f0a83c"/>
      <!-- body -->
      <ellipse cx="98" cy="102" rx="28" ry="32" fill="#f2a63c"/>
      <ellipse cx="90" cy="112" rx="16" ry="20" fill="#f8c46e" opacity="0.85"/>
      <!-- head -->
      <circle cx="122" cy="74" r="17" fill="#f2a63c"/>
      <!-- comb -->
      <path d="M112 60l5-12 5 12z" fill="#d63b2f"/>
      <path d="M120 60l6-13 6 13z" fill="#d63b2f"/>
      <path d="M130 60l5-10 6 10z" fill="#d63b2f"/>
      <!-- beak -->
      <path d="M138 74l18-3-16 11z" fill="#f0851d"/>
      <!-- wattle -->
      <path d="M136 82c5 11-1 16-3 17-5-4-4-13 3-17z" fill="#d63b2f"/>
      <!-- eye -->
      <circle cx="126" cy="71" r="3.4" fill="#241812"/>
      <circle cx="127.2" cy="69.9" r="1.1" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Frame 1: neutral crouch -->
  <g transform="translate(0,0)">
    <g transform="rotate(0 100 150) translate(0 6)">
      <use href="#chick"/>
      <path d="M84 96q18 6 30 0q-6 18-28 12q-6-6-2-12z" fill="#e0872b"/>
    </g>
  </g>

  <!-- Frame 2: lean, wing forward -->
  <g transform="translate(200,0)">
    <g transform="rotate(-8 100 150)">
      <use href="#chick"/>
      <path d="M86 94q22 2 34 10q-14 12-34 6q-6-10 0-16z" fill="#e0872b"/>
    </g>
  </g>

  <!-- Frame 3: balance, wing up -->
  <g transform="translate(400,0)">
    <g transform="rotate(8 100 150)">
      <use href="#chick"/>
      <path d="M86 92q16-14 30-18q0 16-14 24q-12 4-16-6z" fill="#e0872b"/>
    </g>
  </g>

  <!-- Frame 4: recover, wing mid -->
  <g transform="translate(600,0)">
    <g transform="rotate(0 100 150) translate(0 4)">
      <use href="#chick"/>
      <path d="M84 96q20 0 32 6q-10 14-30 8q-6-8-2-14z" fill="#e0872b"/>
    </g>
  </g>
</svg>
